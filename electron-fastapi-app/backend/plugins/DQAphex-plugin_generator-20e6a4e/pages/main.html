{% extends "base.html" %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static_plugin_generator', path='main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static_medioambiente_riles', path='styles/data.css') }}">
{% endblock %}

{% block content %}

<div class="plugin-generator-container">

  <div class="plugin-generator-header">
      <h1>Crear plugin</h1>
      <p>
          Genera automáticamente la estructura base de un nuevo plugin.
      </p>
  </div>
  <div class="plugin-display">
    <form id="plugin-generator-form" class="plugin-generator-form">
      <div class="form-section">
        <div class="form-group">
          <label for="plugin_name">Nombre del plugin</label>
          <input
              type="text"
              id="plugin_name"
              name="plugin_name"
              placeholder="GeneradorDePlugins"
              required
          >
        </div>
        <div class="form-group">
          <label for="plugin_category">Categoría</label>
          <input
              type="text"
              id="plugin_category"
              name="plugin_category"
              placeholder="General"
          >
        </div>
        <div class="form-group">
          <label for="version">Versión</label>
          <input
              type="text"
              id="version"
              name="version"
              value="0.0.1"
              required
          >
        </div>
        <div class="form-group">
          <label for="author">Autor</label>
          <input
              type="text"
              id="author"
              name="author"
              placeholder="Diego Quioza"
              required
          >
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input
              type="email"
              id="email"
              name="email"
              placeholder="dquioza@smu.cl"
              required
          >
        </div>
        <button type="submit">
            Crear plugin
        </button>
      </div>
    </form>
    <div class="plugin-list">
      <div class="plugin-list-header">
        <h3>Lista de Plugins Encontrados</h3>
      </div>
      <div class="plugin-list-plugins">
        {% for plugin in loaded_routers %}
        <p>{{ plugin }}</p>
        {% endfor %}
      </div>
    </div>
  </div>
  <script>
  const form = document.getElementById("plugin-generator-form");

  form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const pluginCategory = document.getElementById("plugin_category").value.trim();
      const payload = {
          plugin_name: formData.get("plugin_name"),
          plugin_category: pluginCategory || null,
          version: formData.get("version"),
          author: formData.get("author"),
          email: formData.get("email")
      };

      try {
          const response = await fetch("/plugin_generator/", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!response.ok) {
              console.error(result);
              alert(result.detail?.message ?? "Error al crear el plugin");
              return;
          }

          console.log(result);
          alert("Plugin creado correctamente");

          form.reset();

      } catch (error) {
          console.error(error);
          alert("No se pudo conectar con el servidor");
      }
  });
  </script>
</div>

{% endblock %}
